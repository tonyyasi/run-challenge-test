<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sharks Run Dashboard</title>
  <style>
    body {
      background-color: #0b141a;
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    .card {
      background-color: #005a6c;
      border: 3px solid #ea7200;
      border-radius: 12px;
      padding: 30px;
      width: 340px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    h1 {
      font-size: 22px;
      margin: 0 0 15px 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-transform: uppercase;
    }
    .date-badge {
      background-color: #000;
      color: #ea7200;
      padding: 5px 15px;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      display: inline-block;
      margin-bottom: 20px;
    }
    .score-display {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 20px;
      color: #fff;
      letter-spacing: 1px;
    }
    .miles-box {
      background-color: #004554;
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
    }
    .miles-number {
      font-size: 56px;
      font-weight: bold;
      line-height: 1;
      margin-bottom: 10px;
    }
    .miles-label {
      font-size: 12px;
      letter-spacing: 1px;
      font-weight: bold;
      text-transform: uppercase;
    }
    .stats-box {
      background-color: #004554;
      border-radius: 10px;
      padding: 15px;
      text-align: left;
    }
    .stat-line {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.1);
      font-size: 14px;
    }
    .stat-line:last-child {
      border-bottom: none;
    }
    .stat-value {
      font-weight: bold;
      color: #ea7200;
    }
    .error-msg {
      background-color: #111;
      color: #ff8a8a;
      padding: 10px;
      border-radius: 5px;
      font-size: 12px;
      margin-top: 20px;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🦈 SHARKS RUN<br>CHALLENGE</h1>
    
    <div class="date-badge" id="date-label">Checking date...</div>

    <div id="score-container" class="score-display" style="display: none;"></div>

    <div class="miles-box">
      <div class="miles-number" id="miles-val">0.00</div>
      <div class="miles-label" id="sub-label">AWAITING SYNC</div>
    </div>

    <div class="stats-box" id="stats-box">
      <div class="stat-line">
        <span>Goals (1 mi each)</span>
        <span class="stat-value" id="goals-val">0</span>
      </div>
      <div class="stat-line">
        <span>Power Play Goals (0.25 mi)</span>
        <span class="stat-value" id="pp-val">0</span>
      </div>
      <div class="stat-line">
        <span>Hat Tricks (+2 mi)</span>
        <span class="stat-value" id="hats-val">0</span>
      </div>
    </div>

    <div id="status-info" class="error-msg" style="display: none;"></div>
  </div>

  <script>
    async function loadWorkoutData() {
      const dateEl = document.getElementById('date-label');
      const scoreEl = document.getElementById('score-container');
      const milesEl = document.getElementById('miles-val');
      const subEl = document.getElementById('sub-label');
      const statsBox = document.getElementById('stats-box');
      const goalsEl = document.getElementById('goals-val');
      const ppEl = document.getElementById('pp-val');
      const hatsEl = document.getElementById('hats-val');
      const statusInfo = document.getElementById('status-info');

      try {
        const response = await fetch('data.json?cache=' + new Date().getTime());
        if (!response.ok) throw new Error('Could not load data.json');
        const data = await response.json();
        
        dateEl.innerText = data.date ? `Game Date: ${data.date}` : "Date Unknown";

        if (data.played === false) {
          milesEl.innerText = "REST";
          subEl.innerText = "NO GAME YESTERDAY";
          statsBox.style.display = "none";
          statusInfo.style.display = "none";
          scoreEl.style.display = "none";
        } else {
          if (data.sharks_score !== undefined && data.opp_score !== undefined) {
            scoreEl.innerText = `SJS ${data.sharks_score} - ${data.opp_score} ${data.opp_name || 'OPP'}`;
            scoreEl.style.display = "block";
          }

          milesEl.innerText = parseFloat(data.total_miles).toFixed(2);
          subEl.innerText = "MILES TO RUN TODAY";
          statsBox.style.display = "block";
          
          goalsEl.innerText = data.goals !== undefined ? data.goals : 0;
          ppEl.innerText = data.pp_goals !== undefined ? data.pp_goals : 0;
          hatsEl.innerText = data.hat_tricks !== undefined ? data.hat_tricks : 0;
          statusInfo.style.display = "none";
        }
      } catch (error) {
        console.error("Failed to load workout data:", error);
        
        dateEl.innerText = "Data Not Available";
        milesEl.innerText = "0.00";
        subEl.innerText = "AWAITING SYNC";
        
        goalsEl.innerText = "0";
        ppEl.innerText = "0";
        hatsEl.innerText = "0";

        statusInfo.style.display = "block";
        statusInfo.innerHTML = "<strong>Data Error:</strong> Could not load <em>data.json</em>.<br>Ensure the automated script has run to generate the latest stats.";
      }
    }

    window.addEventListener('DOMContentLoaded', loadWorkoutData);
  </script>
</body>
</html>
